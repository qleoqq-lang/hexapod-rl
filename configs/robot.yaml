# Inherited from archive except values explicitly marked EXPERIMENTAL.
model: mujoco/hexapod_rl.xml
frame_skip: 10
episode_seconds: 12.0
action_scale_rad: 0.35
kp: [20.0, 20.0, 20.0]
kd: [0.5, 0.8, 0.8]
torque_limit_nm: 7.0
reset:
  xy_noise_m: 0.005
  joint_noise_rad: 0.015
  velocity_noise: 0.01
termination:
  min_height_m: 0.10
  min_upright: 0.4   # cos(total tilt); ~66.4 degrees
  max_height_m: 0.30 # EXPERIMENTAL guard, not a hardware limit
  joint_tolerance_rad: 0.02 # EXPERIMENTAL soft-constraint allowance
reward:
  forward: 1.0
  forward_speed_cap_m_s: 0.25 # EXPERIMENTAL walking objective
  orientation: 0.25
  angular_velocity: 0.02    # EXPERIMENTAL
  action_rate: 0.02
  energy: 0.002
  termination: 5.0          # EXPERIMENTAL failure penalty, not time limit
